<!DOCTYPE html>
<html>

<head>

<title>Books Module</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
    text-align:center;
}

.box{
    width:90%;
    max-width:1000px;
    margin:auto;
    margin-top:40px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

input{
    width:90%;
    padding:10px;
    margin:10px;
    font-size:16px;
}

button{
    padding:10px 20px;
    font-size:16px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    opacity:0.8;
}

.back{
    background:blue;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
}

table,th,td{
    border:1px solid black;
}

th{
    background:#4CAF50;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    text-align:center;
}

.edit{
    background:orange;
    color:white;
    padding:6px 12px;
    text-decoration:none;
    border-radius:5px;
}

.delete{
    background:red;
    color:white;
    padding:6px 12px;
    text-decoration:none;
    border-radius:5px;
}

</style>

</head>

<body>

<div class="box">

<h2>Book Management</h2>

<a href="/add_book">
<button>
Add New Book
</button>
</a>

<br><br>

<a href="/dashboard">
<button class="back">
Back to Dashboard
</button>
</a>

<h2>Book List</h2>

<!-- SEARCH BOX -->

<form action="/books" method="GET">

<input
type="text"
name="search"
placeholder="Search by Book Name / Author / Category"
value="{{ search }}">

<button
type="submit"
style="background:#2196F3;">
Search
</button>

</form>

<table>

<tr>

<th>ID</th>
<th>Book Name</th>
<th>Author</th>
<th>Category</th>
<th>Quantity</th>
<th>Available Quantity</th>
<th>Action</th>

</tr>

{% for book in books %}

<tr>

<td>{{ book[0] }}</td>

<td>{{ book[1] }}</td>

<td>{{ book[2] }}</td>

<td>{{ book[3] }}</td>

<td>{{ book[4] }}</td>

<td>{{ book[5] }}</td>

<td>

<a class="edit" href="/edit_book/{{ book[0] }}">
Edit
</a>

&nbsp;

<a class="delete"
href="/delete_book/{{ book[0] }}"
onclick="return confirm('Are you sure you want to delete this book?')">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>

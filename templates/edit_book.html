<!DOCTYPE html>
<html>

<head>

    <title>Edit Book</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
        }

        .box{
            width:400px;
            margin:auto;
            margin-top:50px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
            font-size:16px;
        }

        button{
            width:95%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        .back{
            background:blue;
        }

    </style>

</head>


<body>

<div class="box">

<h2>Edit Book</h2>


<form method="POST">


<input
type="text"
name="book_name"
value="{{ book[1] }}"
required>


<input
type="text"
name="author"
value="{{ book[2] }}"
required>


<input
type="text"
name="category"
value="{{ book[3] }}"
required>


<input
type="number"
name="quantity"
value="{{ book[4] }}"
required>


<button type="submit">
Update Book
</button>


</form>


<br>


<a href="/books">

<button class="back">
Back to Books
</button>

</a>


</div>


</body>

</html>

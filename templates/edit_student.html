<!DOCTYPE html>
<html>

<head>

<title>Edit Student</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.box{
width:400px;
margin:auto;
margin-top:40px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

input{
width:90%;
padding:10px;
margin:10px;
font-size:16px;
}

button{
width:95%;
padding:10px;
background:green;
color:white;
border:none;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Edit Student</h2>

<form action="/update_student/{{ student[0] }}" method="POST">

<input type="text" name="name" value="{{ student[1] }}" required>

<input type="text" name="department" value="{{ student[2] }}" required>

<input type="text" name="year" value="{{ student[3] }}" required>

<input type="email" name="email" value="{{ student[4] }}" required>

<input type="text" name="phone" value="{{ student[5] }}" required>

<button type="submit">
Update Student
</button>

</form>

<br>

<a href="/student">
<button style="background:blue;">
Back
</button>
</a>

</div>

</body>

</html>

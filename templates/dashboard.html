<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Library Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:url("/static/images/dashboard_bg.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.overlay{
    width:100%;
    min-height:100vh;
    background:rgba(0,0,0,0.45);
    padding:30px;
}

.header{
    text-align:center;
    color:white;
}

.header h1{
    font-size:42px;
    margin-bottom:10px;
}

.header p{
    font-size:18px;
}

.datetime{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:20px;
    color:white;
    font-size:18px;
}

.cards{
    width:95%;
    max-width:1200px;
    margin:35px auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(12px);
    border-radius:18px;
    padding:25px;
    text-align:center;
    color:white;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.card h2{
    font-size:45px;
    color:#00ff99;
}

.card h3{
    margin-top:10px;
}

.menu{
    width:420px;
    margin:auto;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(15px);
    padding:30px;
    border-radius:20px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.3);
}

.menu h2{
    color:white;
    margin-bottom:25px;
    text-align:center;
}

.menu a{
    text-decoration:none;
}

.menu button{
    width:100%;
    padding:14px;
    margin:8px 0;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#27ae60;
    color:white;
    transition:.3s;
}

.menu button:hover{
    transform:scale(1.03);
    background:#1e8449;
}

.logout{
    background:#e74c3c !important;
}

.logout:hover{
    background:#c0392b !important;
}

@media(max-width:900px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .menu{
        width:95%;
    }
}

@media(max-width:600px){
    .cards{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:30px;
    }
}

</style>

</head>

<body>

<div class="overlay">

<div class="header">

    <div class="logo">
    <img src="{{ url_for('static', filename='images/library_logo.png') }}" alt="Library Logo">
</div>

<h1>📚 Library Management System</h1>

<p>Welcome {{ session['username'] }}</p>

<div class="datetime">
<div id="date"></div>
<div id="time"></div>
</div>

</div>

<div class="cards">

<div class="card">
<h2>{{ total_students }}</h2>
<h3>Students</h3>
</div>

<div class="card">
<h2>{{ total_staff }}</h2>
<h3>Staff</h3>
</div>

<div class="card">
<h2>{{ total_books }}</h2>
<h3>Books</h3>
</div>

<div class="card">
<h2>{{ total_issued }}</h2>
<h3>Issued</h3>
</div>

</div>

<div class="menu">

<h2>Dashboard</h2>

<a href="/students">
<button>👨‍🎓 Student </button>
</a>

<a href="/staff">
<button>👨‍🏫 Staff </button>
</a>

<a href="/books">
<button>📚 Books </button>
</a>

<a href="/issue_books">
<button>📖 Student Issue </button>
</a>

<a href="/staff_issue">
<button>📝 Staff Issue </button>
</a>

<a href="/return">
<button>↩ Return </button>
</a>

<!-- NEW REPORTS BUTTON -->
<a href="/reports">
<button>📊 Reports</button>
</a>

<a href="/logout">
<button class="logout">🚪 Logout</button>
</a>

</div>

</div>

<script>

function updateDateTime(){

const now = new Date();

document.getElementById("date").innerHTML =
"📅 " + now.toLocaleDateString();

document.getElementById("time").innerHTML =
"🕒 " + now.toLocaleTimeString();

}

updateDateTime();

setInterval(updateDateTime,1000);

</script>

</body>
</html>

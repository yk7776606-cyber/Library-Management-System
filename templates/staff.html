<!DOCTYPE html>
<html>

<head>

    <title>Staff Module</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
        }

        .box{
            width:90%;
            max-width:1000px;
            margin:auto;
            margin-top:40px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
            font-size:16px;
        }

        button{
            width:95%;
            padding:10px;
            font-size:18px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            opacity:0.8;
        }

        .back{
            background:blue;
            margin-top:10px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:30px;
        }

        table,th,td{
            border:1px solid black;
        }

        th{
            background:#4CAF50;
            color:white;
            padding:10px;
        }

        td{
            padding:10px;
            text-align:center;
        }

        .edit{
            background:orange;
            color:white;
            padding:6px 12px;
            text-decoration:none;
            border-radius:5px;
        }

        .delete{
            background:red;
            color:white;
            padding:6px 12px;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

<div class="box">

<h2>Staff Registration</h2>

<form action="/staff" method="POST">

<input
type="text"
name="staff_name"
placeholder="Enter Staff Name"
required>

<input
type="text"
name="department"
placeholder="Department"
required>

<input
type="text"
name="phone"
placeholder="Phone Number"
required>

<input
type="email"
name="email"
placeholder="Email"
required>

<button type="submit">
Save Staff
</button>

</form>

<br>

<a href="/dashboard">
<button class="back">
Back to Dashboard
</button>
</a>

<h2>Staff List</h2>

<!-- Search Box -->

<form action="/staff" method="GET">

<input
type="text"
name="search"
placeholder="Search by Staff Name / Department / Email"
value="{{ search }}">

<button
type="submit"
style="background:#2196F3;">
Search
</button>

</form>

<table>

<tr>

<th>ID</th>
<th>Staff Name</th>
<th>Department</th>
<th>Phone</th>
<th>Email</th>
<th>Action</th>

</tr>

{% for row in staff %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>

<td>

<a class="edit" href="/edit_staff/{{ row[0] }}">
Edit
</a>

&nbsp;

<a class="delete"
href="/delete_staff/{{ row[0] }}"
onclick="return confirm('Are you sure you want to delete this staff?')">
Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>

<!DOCTYPE html>
<html>
<head>
    <title>Edit Staff</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:400px;
            margin:40px auto;
            background:white;
            padding:20px;
            border-radius:8px;
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Edit Staff</h2>

<form method="POST">

<input type="text" name="staff_name" value="{{ staff[1] }}" required>

<input type="text" name="department" value="{{ staff[2] }}" required>

<input type="text" name="phone" value="{{ staff[3] }}" required>

<input type="email" name="email" value="{{ staff[4] }}" required>

<button type="submit">Update Staff</button>

</form>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Issue Book</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Issue Book</h2>

    <form method="POST" action="/issue_book">


        <label>Student</label>
        <select name="student_id" required>

            {% for student in students %}
            <option value="{{student[0]}}">
                {{student[1]}}
            </option>
            {% endfor %}

        </select>


        <label>Book</label>
        <select name="book_id" required>

            {% for book in books %}
            <option value="{{book[0]}}">
                {{book[1]}}
            </option>
            {% endfor %}

        </select>


        <label>Issue Date</label>
        <input type="date" name="issue_date" required>


        <label>Return Date</label>
        <input type="date" name="return_date" required>


        <label>Status</label>
        <input type="text" name="status" value="Issued">


        <button type="submit">
            Issue Book
        </button>


    </form>


    <a href="/dashboard">Back</a>


</div>

</body>
</html>
